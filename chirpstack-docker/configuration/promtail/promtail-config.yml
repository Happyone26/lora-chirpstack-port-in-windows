server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # filter at the Docker API level - relabel_configs "keep"/"drop" is not
        # honored by promtail's docker service discovery in this version, this is
        # the reliable way to scope log collection to a single container
        filters:
          - name: label
            values: ["com.docker.compose.service=mqtt-stats-exporter"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/chirpstack-docker-(.*)-[0-9]+"
        target_label: "compose_service"
    pipeline_stages:
      - json:
          expressions:
            event: event
            device_id: device_id
      - labels:
          event:
          device_id:
